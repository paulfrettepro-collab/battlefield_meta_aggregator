name: 'bf6_meta_aggregator'
version: '1.0.0'
config-version: 2

# This setting configures which "profile" dbt uses for this project.
profile: 'bf6_meta'

# These configurations specify where dbt should look for different types of files.
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# Configuring models
models:
  bf6_meta_aggregator:
    # Bronze layer (sources)
    bronze:
      +materialized: view
      +schema: bronze
      
    # Silver layer (cleaned)
    silver:
      +materialized: table
      +schema: silver
      
    # Gold layer (analytics)
    gold:
      +materialized: table
      +schema: gold
