# ============================================
# docker-compose.yml - Battlefield Meta Aggregator
# ============================================
# MinIO uniquement pour le MVP (Phase 1)

version: '3.8'

services:
  # ============================================
  # DATA LAKE - MINIO
  # ============================================
  minio:
    image: minio/minio:latest
    container_name: bf6_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"      # API
      - "9001:9001"      # Console Web
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

# ============================================
# VOLUMES PERSISTANTS
# ============================================
volumes:
  minio_data:
    driver: local
